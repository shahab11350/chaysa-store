<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فیلم‌های آموزشی | چایسا</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,sans-serif;background:#f7f5ef;color:#26372b}
header{background:#173b2b;color:#fff;text-align:center;padding:34px 16px}
header .logo{font-size:30px;font-weight:bold;letter-spacing:3px;color:#e6cc85}
header h1{margin:12px 0 6px;font-size:23px}
header p{margin:0;color:#eee3c5;line-height:2;font-size:13px}
nav{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;background:#244b37;padding:14px}
nav a{color:#fff;text-decoration:none;font-size:14px}
main{max-width:900px;margin:30px auto;padding:0 16px;min-height:45vh}
.panel{background:#fff;border:1px solid #e6d9b8;border-radius:16px;padding:28px 18px;text-align:center;box-shadow:0 4px 16px #0000000a}
.panel h2{color:#173b2b;margin-top:0}
.panel p{line-height:2;color:#666;font-size:14px}
.empty{margin:24px auto 4px;padding:20px;border:1px dashed #c5a45b;border-radius:12px;color:#8b7544;background:#fcfaf5;line-height:2}
footer{background:#173b2b;color:#fff;text-align:center;padding:22px;line-height:2;font-size:13px}
</style>

<style>
.chaysa-exit-link{position:fixed;top:12px;left:12px;z-index:99999;display:inline-flex;align-items:center;gap:7px;background:#173b2b;color:#fff;text-decoration:none;border:1px solid #d7bd78;border-radius:999px;padding:10px 15px;font: bold 13px Tahoma,sans-serif;box-shadow:0 3px 12px #0002}
.chaysa-exit-link:active{transform:scale(.97)}
@media(max-width:480px){.chaysa-exit-link{top:8px;left:8px;padding:9px 11px;font-size:12px}}
</style>
</head>
<body>
<a class="chaysa-exit-link" href="exit.html" aria-label="خروج از فروشگاه">خروج از فروشگاه <span aria-hidden="true">↗</span></a>

<header>
<div class="logo">CHAYSA</div>
<h1>فیلم‌های آموزشی چایسا</h1>
<p>آموزش و آشنایی بیشتر با محصولات</p>
</header>
<nav>
<a href="index.html">صفحه اصلی</a>
<a href="products.html">محصولات</a>
<a href="tutorials.html">فیلم‌های آموزشی</a>
</nav>
<main>
<section class="panel">
<h2>فیلم‌های آموزشی</h2>
<p>در این بخش، ویدئوهای آموزشی مرتبط با محصولات چایسا قرار می‌گیرند.</p>
<div class="empty">فیلم‌های آموزشی به‌زودی در این صفحه قرار می‌گیرند.</div>
</section>
</main>
<footer>CHAYSA | چایسا</footer>

<script>
// Keep Chaysa's internal pages from piling up in the browser's Back history.
document.addEventListener("click", function(event) {
  const link = event.target.closest("a");
  if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.target === "_blank") return;
  const destination = new URL(link.href, window.location.href);
  if (destination.origin !== window.location.origin) return;
  const page = destination.pathname.split("/").pop();
  if (["index.html", "products.html", "tutorials.html", "exit.html"].includes(page) && destination.pathname !== window.location.pathname) {
    event.preventDefault();
    window.location.replace(destination.href);
  }
});
</script>
</body>
</html>
