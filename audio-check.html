<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio test</title><body style="font-family:Tahoma;background:#21170f;color:#fff;padding:24px"><h2>آزمایش صداهای چایسا</h2><p>برای هر صدا دکمهٔ پخش را بزنید.</p><div id="items"></div><pre id="status" style="white-space:pre-wrap"></pre><script>
const sounds=[
["کلیک دکمه","https://assets.mixkit.co/active_storage/sfx/1113/1113.wav"],
["چرخش چرخ","https://assets.mixkit.co/active_storage/sfx/1613/1613.wav"],
["تشویق و شادی","https://assets.mixkit.co/active_storage/sfx/518/518.wav"]
];
const status=document.getElementById("status");
for(const [name,url] of sounds){
 const a=new Audio(url);a.preload="auto";
 const log=m=>status.textContent+="\n"+name+": "+m;
 a.addEventListener("canplay",()=>log("canplay"));
 a.addEventListener("canplaythrough",()=>log("canplaythrough"));
 a.addEventListener("error",()=>log("ERROR code="+(a.error&&a.error.code)));
 a.addEventListener("playing",()=>log("PLAYING"));
 a.addEventListener("ended",()=>log("ENDED"));
 const b=document.createElement("button");b.textContent="پخش "+name;b.style="display:block;margin:14px 0;padding:14px;font-size:18px";
 b.onclick=()=>{a.currentTime=0;a.play().then(()=>log("play() resolved")).catch(e=>log("play() rejected: "+e.name+" "+e.message))};
 document.getElementById("items").append(b);
}
</script></body></html>
