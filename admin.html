<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت چایسا</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#26372b;font:15px Tahoma,sans-serif}header{background:#173b2b;color:#fff;padding:22px;text-align:center}header b{color:#e6cc85;font-size:24px}.wrap{max-width:850px;margin:22px auto;padding:0 14px}.panel{background:#fff;border:1px solid #e8dfca;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 14px #0000000a}h2{font-size:18px;margin:0 0 16px}label{display:block;font-weight:bold;margin:12px 0 7px}input,select{width:100%;padding:13px;border:1px solid #d9d2c2;border-radius:9px;font:inherit;background:white}button{border:0;border-radius:9px;padding:12px 16px;background:#244b37;color:white;font:inherit;cursor:pointer}button.secondary{background:#eee9dc;color:#443b2a}button.danger{background:#9d3939}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.product{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee8d8}.product img{width:72px;height:72px;object-fit:cover;border-radius:9px;background:#f4f1e8}.product small{display:block;color:#777;margin-top:6px}.muted{color:#777;font-size:12px;line-height:1.9}.hidden{display:none!important}#status{padding:10px;border-radius:8px;background:#f7f5ef;margin:10px 0}.product button{padding:8px 10px;font-size:12px}@media(max-width:460px){.product{grid-template-columns:56px 1fr}.product img{width:56px;height:56px}.product .actions{grid-column:2}.row>*{min-width:100%}}
</style><header><b>CHAYSA</b><div>پنل مدیریت فروشگاه</div></header><main class="wrap">
<section id="login" class="panel"><h2>ورود مدیر</h2><label>رمز عبور مدیریت</label><input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور"><p class="muted">این صفحه برای مدیریت فروشگاه است و ورود آن با نشست امن سمت سرور انجام می‌شود.</p><button id="loginBtn">ورود به مدیریت</button></section>
<section id="app" class="hidden"><div class="panel"><div class="row"><h2>محصولات فروشگاه</h2><button id="logout" class="secondary">خروج امن</button></div><div id="status">در حال بارگذاری…</div><div id="items"></div></div>
<div class="panel"><h2 id="formTitle">افزودن محصول</h2><input id="editIndex" type="hidden"><label>نام محصول</label><input id="name" placeholder="نام محصول"><div class="row"><div><label>شناسه کالا</label><input id="sku" placeholder="مثلاً 1401001"></div><div><label>قیمت (تومان)</label><input id="price" inputmode="numeric" placeholder="مثلاً ۴۷۹۰۰۰"></div></div><label>دسته‌بندی</label><select id="category"><option>چای</option><option>دمنوش</option><option>ادویه</option><option>عسل</option><option>سایر</option></select><label>عکس محصول</label><input id="photo" type="file" accept="image/*"><p class="muted">عکس تا ۵ مگابایت؛ از گالری گوشی انتخاب کن.</p><div class="row"><button id="save">ذخیره محصول</button><button id="clear" class="secondary">پاک‌کردن فرم</button></div></div></section></main>
<script>
let products=[];
const $=id=>document.getElementById(id), status=m=>$('status').textContent=m;
async function api(path,opts={}){const r=await fetch('/api/admin/'+path,{credentials:'same-origin',...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'خطا در ارتباط با سرور');return d}
function render(){ $('items').innerHTML='';products.forEach((p,i)=>{const el=document.createElement('div');el.className='product';const img=document.createElement('img');img.src=p.image||'';img.alt='';const info=document.createElement('div');const title=document.createElement('b');title.textContent=p.name;const meta=document.createElement('small');meta.textContent=(p.category||'')+' · '+(p.price||0).toLocaleString('fa-IR')+' تومان · '+(p.sku||'بدون شناسه')+' · '+(p.active===false?'غیرفعال':'فعال');info.append(title,meta);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.textContent='ویرایش';edit.onclick=()=>fill(i);const del=document.createElement('button');del.textContent='حذف';del.className='danger';del.onclick=async()=>{if(confirm('این محصول حذف شود؟')){products.splice(i,1);await saveAll()}};const toggle=document.createElement('button');toggle.textContent=p.active===false?'فعال‌سازی':'غیرفعال‌سازی';toggle.className='secondary';toggle.onclick=async()=>{products[i].active=products[i].active===false;await saveAll()};actions.append(edit,toggle,del);el.append(img,info,actions);$('items').append(el)})}
async function load(){products=await api('products');render();status('تعداد محصولات: '+products.length)}
async function saveAll(){try{await api('products',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(products)});render();status('تغییرات با موفقیت ذخیره شد.')}catch(e){status(e.message)}}
$('loginBtn').onclick=async()=>{try{await api('login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){alert(e.message)}};
$('logout').onclick=async()=>{await api('logout',{method:'POST'});location.reload()};
function fill(i){const p=products[i];$('editIndex').value=i;$('name').value=p.name;$('sku').value=p.sku||'';$('price').value=p.price||'';$('category').value=p.category||'چای';$('formTitle').textContent='ویرایش محصول'}
$('clear').onclick=()=>{['editIndex','name','sku','price','photo'].forEach(x=>$(x).value='');$('formTitle').textContent='افزودن محصول'};
$('save').onclick=async()=>{try{const name=$('name').value.trim(),price=Number($('price').value.replace(/[^0-9]/g,''));if(!name||!price)throw Error('نام و قیمت محصول را کامل وارد کن.');let image=products[Number($('editIndex').value)]?.image||'';const file=$('photo').files[0];if(file){const fd=new FormData();fd.append('image',file);const uploaded=await api('upload',{method:'POST',body:fd});image=uploaded.url}const p={name,sku:$('sku').value.trim(),price,category:$('category').value,image,active:products[Number($('editIndex').value)]?.active!==false};const idx=$('editIndex').value;if(idx==='')products.push(p);else products[Number(idx)]=p;await saveAll();$('clear').click()}catch(e){status(e.message)}};
(async()=>{try{await load();$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch{} })();
</script></html>
