<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>پاسخ‌گویی چایسا</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#26372b;font:15px Tahoma,sans-serif}header{background:#173b2b;color:#fff;padding:24px 16px;text-align:center}header b{color:#e6cc85;font-size:25px}.wrap{max-width:760px;margin:22px auto;padding:0 14px}.panel,.question{background:#fff;border:1px solid #e8dfca;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 14px #0000000a}h2{font-size:18px;margin:0 0 14px}label{display:block;font-weight:bold;margin:12px 0 7px}input,textarea{width:100%;padding:13px;border:1px solid #d9d2c2;border-radius:9px;font:inherit;background:white}textarea{min-height:110px;line-height:2;resize:vertical}button{border:0;border-radius:9px;padding:12px 16px;background:#244b37;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.muted{color:#777;font-size:12px;line-height:2}.hidden{display:none!important}.status{background:#f7f5ef;padding:10px;border-radius:8px;margin:12px 0;line-height:2}.question{line-height:2}.question p{white-space:pre-wrap}.previous{background:#f7f5ef;padding:10px;border-radius:8px;white-space:pre-wrap}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style>
<header><b>CHAYSA</b><div>صفحهٔ اختصاصی پاسخ‌گویی به پرسش‌های مشتریان</div></header><main class="wrap">
<section id="login" class="panel"><h2>ورود همکار</h2><label for="password">رمز اختصاصی</label><input id="password" type="password" autocomplete="current-password" placeholder="رمز دسترسی"><p class="muted">این صفحه فقط با رمز اختصاصی قابل استفاده است.</p><button id="loginBtn">ورود به صفحه پاسخ‌گویی</button><div id="loginStatus" class="status hidden"></div></section>
<section id="app" class="hidden"><div class="panel"><div class="actions"><h2 style="flex:1">پرسش‌های مشتریان</h2><button id="refresh">به‌روزرسانی</button><button id="logout" style="background:#eee9dc;color:#443b2a">خروج امن</button></div><div id="status" class="status">در حال دریافت پرسش‌ها…</div><div id="questions"></div></div></section></main>
<script>
const $=id=>document.getElementById(id);
async function api(path,opts={}){const r=await fetch('/api/bostani/'+path,{credentials:'same-origin',...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'خطا در ارتباط با سرور');return d}
async function load(){const host=$('questions'),status=$('status');status.textContent='در حال دریافت پرسش‌ها…';host.replaceChildren();try{const rows=await api('questions');if(!rows.length){status.textContent='هنوز پرسشی ثبت نشده است.';return}status.textContent='تعداد پرسش‌ها: '+rows.length;rows.forEach(q=>{const box=document.createElement('article');box.className='question';const title=document.createElement('b');title.textContent=q.id+' · '+q.status;const meta=document.createElement('div');meta.className='muted';meta.textContent='زمان ثبت: '+new Date(q.createdAt).toLocaleString('fa-IR')+' · '+(q.customerLinked?'اتصال تلگرام مشتری برقرار است':'مشتری هنوز اتصال تلگرام را کامل نکرده');const question=document.createElement('p');question.textContent=q.question;box.append(title,meta,question);if(q.reply){const old=document.createElement('div');old.className='previous';old.textContent='پاسخ قبلی: '+q.reply;box.append(old)}const area=document.createElement('textarea');area.maxLength=4000;area.placeholder='پاسخ مشتری را اینجا بنویسید…';const send=document.createElement('button');send.textContent='ارسال پاسخ به مشتری';send.disabled=!q.customerLinked;send.title=q.customerLinked?'':'مشتری باید ابتدا از لینک اختصاصی پرسش وارد ربات چایسا شود و Start را بزند';send.onclick=async()=>{const reply=area.value.trim();if(!reply){alert('لطفاً متن پاسخ را بنویسید.');return}if(!confirm('پاسخ برای مشتری در تلگرام ارسال شود؟'))return;send.disabled=true;send.textContent='در حال ارسال…';try{await api('questions/'+encodeURIComponent(q.id)+'/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reply})});await load()}catch(e){alert(e.message);send.disabled=false;send.textContent='ارسال پاسخ به مشتری'}};box.append(area,send);host.append(box)})}catch(e){status.textContent=e.message}}
$('loginBtn').onclick=async()=>{const s=$('loginStatus');s.classList.remove('hidden');s.textContent='در حال بررسی…';try{await api('login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){s.textContent=e.message}};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('refresh').onclick=load;$('logout').onclick=async()=>{await api('logout',{method:'POST'});location.reload()};
</script></html>
