<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<title>تأیید دریافت نامه | CHAYSA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#25251f;font:15px/2 Tahoma,Arial,sans-serif;padding:20px}
main{max-width:680px;margin:28px auto;background:#fff;border:1px solid #e2dccb;border-radius:16px;padding:24px;box-shadow:0 8px 28px #0000000a}
.brand{text-align:center;color:#315b43;font-weight:bold;font-size:24px;letter-spacing:2px}
h1{font-size:20px;text-align:center;margin:8px 0 20px}
.meta{color:#68685f;font-size:13px;border-bottom:1px solid #eee7d9;padding-bottom:12px}
.letter{white-space:pre-wrap;overflow-wrap:anywhere;margin:20px 0;padding:16px;background:#fffdf8;border:1px solid #eee7d9;border-radius:10px}
.question{font-weight:bold;text-align:center;margin:22px 0 10px}
button{width:100%;border:0;border-radius:10px;padding:14px;background:#315b43;color:white;font: bold 16px Tahoma;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
#status{text-align:center;margin-top:14px;color:#315b43;white-space:pre-wrap}
.note{font-size:12px;color:#777;text-align:center;margin-top:16px}
</style></head>
<body><main>
<div class="brand">CHAYSA</div><h1>تأیید دریافت نامه</h1>
<div id="meta" class="meta">در حال بررسی پیوند…</div>
<div id="letter" class="letter" hidden></div>
<div id="question" class="question" hidden>آیا نامه را دریافت کرده‌اید؟</div>
<button id="confirm" hidden disabled>بله، دریافت کردم</button>
<div id="status" role="status" aria-live="polite"></div>
<div class="note">این گزینه فقط دریافت نامه را ثبت می‌کند و به معنی تأیید محتوای نامه نیست.</div>
</main>
<script>
(()=>{
 const token=location.hash.slice(1),meta=document.getElementById('meta'),letter=document.getElementById('letter'),question=document.getElementById('question'),button=document.getElementById('confirm'),status=document.getElementById('status');
 history.replaceState(null,'',location.pathname);
 async function post(path){const r=await fetch('/api/letter-receipt/'+path,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({token})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'خطا در ارتباط با سرور');return d}
 if(!/^[A-Za-z0-9_-]{40,60}$/.test(token)){meta.textContent='پیوند دریافت نامه معتبر نیست.';return}
 post('view').then(d=>{
  meta.textContent='شماره نامه: '+d.letterNumber+' · تاریخ: '+d.dateTime;
  letter.textContent=[d.body,'',d.signatureName,d.signatureRole].join('\n');letter.hidden=false;
  if(d.receiptStatus==='received'){status.textContent='دریافت این نامه قبلاً در بایگانی ثبت شده است.'+(d.receivedAt?'\\nزمان ثبت: '+new Date(d.receivedAt).toLocaleString('fa-IR'):'');return}
  question.hidden=false;button.hidden=false;button.disabled=false;
 }).catch(e=>{meta.textContent=e.message});
 button.addEventListener('click',async()=>{
  button.disabled=true;status.textContent='در حال ثبت دریافت در بایگانی…';
  try{const d=await post('confirm');status.textContent='دریافت نامه در بایگانی چایسا ثبت شد.';button.textContent='دریافت ثبت شد';question.hidden=true}
  catch(e){status.textContent=e.message;button.disabled=false}
 });
})();
</script></body></html>
