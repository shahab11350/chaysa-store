name = "chaysa-backup"
main = "worker.js"
compatibility_date = "2026-11-14"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "CHSY_PRODUCTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "CHSY_IMAGES"
bucket_name = "chaysa-backup-product-images"
