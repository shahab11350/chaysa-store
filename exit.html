<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>به امید دیدار | چایسا</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Tahoma,sans-serif;background:radial-gradient(circle at top,#315b43 0,#173b2b 58%,#102b20 100%);color:#fff}
.exit-card{width:min(560px,100%);padding:42px 24px;text-align:center;border:1px solid #d8bd79;border-radius:28px;background:#ffffff0c;box-shadow:0 18px 55px #0003}
.logo{font-size:30px;font-weight:bold;letter-spacing:4px;color:#e6cc85;margin-bottom:28px}
.message{font-size:clamp(22px,5vw,30px);line-height:2.1;font-weight:bold;margin:0 0 26px}
.message .bye{display:block;color:#fff}
.message .back{display:block;color:#f0d99e}
.return{display:inline-block;margin-top:10px;padding:13px 25px;border-radius:999px;background:#d8bd79;color:#173b2b;text-decoration:none;font-weight:bold}
.small{margin-top:24px;color:#e7e0cf;font-size:13px;line-height:2}
</style>
</head>
<body>
<main class="exit-card">
<div class="logo">CHAYSA</div>
<p class="message"><span class="bye">فعلاً خداحافظ 😢</span><span class="back">... ولی قول بده زود برگردی 🙏</span></p>
<button class="return" type="button" id="chaysaFarewellExit" style="display:block;width:fit-content;margin:12px auto 0;background:transparent;color:#e6cc85;border:1px solid #d8bd79;cursor:pointer;font:bold 15px Tahoma,sans-serif">خدا نگهدارت باشه</button>

</main>

<script>
// Keep Chaysa's internal pages from piling up in the browser's Back history.
document.addEventListener("click", function(event) {
  const link = event.target.closest("a");
  if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.target === "_blank") return;
  const destination = new URL(link.href, window.location.href);
  if (destination.origin !== window.location.origin) return;
  const page = destination.pathname.split("/").pop();
  if (["index.html", "products.html", "tutorials.html", "exit.html"].includes(page) && destination.pathname !== window.location.pathname) {
    event.preventDefault();
    window.location.replace(destination.href);
  }
});
</script>

<script>
document.getElementById("chaysaFarewellExit").addEventListener("click", function () {
  window.location.replace(new URL("./index.html?skipWelcome=1", window.location.href).href);
});
</script>
</body>
</html>
