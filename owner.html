<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CHAYSA OWNER | مدیریت فروشگاه</title>
<style>
:root{--bg:#eef2ec;--surface:#fff;--ink:#203128;--muted:#718076;--line:#dce5dc;--green:#194a34;--green2:#e3eee5;--gold:#c18a38;--red:#a83d37;--shadow:0 5px 20px #173b2b0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.8 Tahoma,Arial,sans-serif}
header{background:var(--green);color:#fff;padding:15px max(16px,calc((100% - 1120px)/2));display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
.brand{flex:1}.brand b{font-size:23px;letter-spacing:2px;color:#e7d29b}.brand span{display:block;font-size:12px;color:#e5eee7}
button,a.btn{border:0;border-radius:9px;padding:9px 13px;background:var(--green);color:white;font:inherit;text-decoration:none;cursor:pointer;display:inline-block}
button.light,a.light{background:var(--green2);color:var(--green)}button.danger{background:#f8e8e6;color:var(--red)}button:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1120px;margin:22px auto;padding:0 14px 40px}.intro{margin:0 0 18px}.intro h1{font-size:21px;margin:0}.intro p{color:var(--muted);margin:3px 0}
#login,.panel,.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
#login{max-width:430px;margin:50px auto;padding:22px}label{display:block;margin:10px 0 4px;color:var(--muted);font-size:13px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fbfcfa;color:var(--ink);font:inherit}
textarea{min-height:100px;resize:vertical}.hidden{display:none!important}
#status{padding:9px 12px;background:var(--green2);border-radius:9px;margin:12px 0;color:var(--green)}
.tabs{display:flex;gap:6px;overflow:auto;padding:5px 0 12px}.tabs button{white-space:nowrap;background:#fff;color:var(--muted);border:1px solid var(--line)}.tabs button.active{background:var(--green);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.stat{padding:13px}.stat small{display:block;color:var(--muted)}.stat b{font-size:20px}
.panel{padding:15px;margin:0 0 13px}.panel h2{font-size:16px;margin:0 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:180px}
.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:right;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--muted)}
.tag{display:inline-block;border-radius:20px;padding:2px 9px;background:var(--green2);color:var(--green);font-size:12px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.actions{display:flex;gap:6px;flex-wrap:wrap}.muted{font-size:12px;color:var(--muted)}.empty{padding:18px;text-align:center;color:var(--muted)}
dialog{width:min(520px,94vw);border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);padding:18px}dialog::backdrop{background:#0c1a12a8}.dialog-actions{display:flex;gap:8px;margin-top:15px}.dialog-actions>*{flex:1}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}header{padding:12px 14px}.brand b{font-size:20px}}
</style>
</head>
<body>
<header><div class="brand"><b>CHAYSA</b><span>OWNER · پنل اختصاصی مالک</span></div><button id="logout" class="light hidden">خروج امن</button></header>
<main>
<section id="login"><h1>ورود مالک</h1><p class="muted">ورود از طریق نشست امن سمت سرور انجام می‌شود.</p><label for="password">رمز عبور مالک</label><input id="password" type="password" autocomplete="current-password"><div id="loginError" class="muted"></div><button id="loginBtn" style="width:100%;margin-top:12px">ورود به پنل</button></section>
<section id="app" class="hidden">
<div class="intro"><h1>مدیریت چایسا</h1><p>مرکز مدیریت سفارش‌ها، پیش‌فاکتورها، پیام‌ها و گزارش‌ها</p></div>
<div id="status" role="status">در حال بارگذاری اطلاعات…</div>
<nav class="tabs" id="tabs">
<button data-view="dash" class="active">داشبورد</button><button data-view="orders">سفارش‌ها</button><button data-view="invoices">پیش‌فاکتورها</button><button data-view="messages">پیام‌ها</button><button data-view="customers">مشتری‌ها</button>
</nav>
<section id="view"></section>
</section>
</main>
<dialog id="dlg"></dialog>
<script>
const $=id=>document.getElementById(id), fa=n=>Number(n||0).toLocaleString('fa-IR'), money=n=>fa(n)+' تومان';
const STATUSES=['جدید','در حال آماده‌سازی','ارسال شد','تحویل','لغو'];
const INVOICE_STATUSES=['پیش‌نویس','ارسال شد','پرداخت شد','لغو'];
let data={orders:[],invoices:[],messages:[]},view='dash',query='';
const status=m=>$('status').textContent=m;
async function api(path,opts={}){const r=await fetch('/api/admin/'+path,{credentials:'same-origin',...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'خطا در ارتباط با سرور');return d}
async function load(){data=await api('owner-data');data.orders=data.orders||[];data.invoices=data.invoices||[];data.messages=data.messages||[];render();status('اطلاعات از فضای ذخیره‌سازی مرکزی بارگذاری شد.')}
async function save(){try{await api('owner-data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});status('تغییرات در فضای ذخیره‌سازی مرکزی ثبت شد.');render()}catch(e){status('ذخیره انجام نشد: '+e.message);throw e}}
function nav(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
function dash(){const active=data.orders.filter(o=>o.status!=='لغو'),total=active.reduce((s,o)=>s+Number(o.total||0),0),fresh=data.orders.filter(o=>o.status==='جدید').length;return `<div class="stats"><div class="stat"><small>مجموع فروش ثبت‌شده</small><b>${money(total)}</b></div><div class="stat"><small>کل سفارش‌ها</small><b>${fa(data.orders.length)}</b></div><div class="stat"><small>سفارش جدید</small><b>${fa(fresh)}</b></div><div class="stat"><small>پیش‌فاکتورها</small><b>${fa(data.invoices.length)}</b></div></div><div class="panel"><h2>دسترسی سریع</h2><div class="actions"><button data-go="orders">ثبت سفارش</button><button data-go="invoices" class="light">ساخت پیش‌فاکتور</button><button data-go="messages" class="light">مدیریت پیام‌ها</button><a class="btn" href="/admin.html">مدیریت محصولات</a></div><p class="muted">توجه: سفارش‌هایی که در این بخش ثبت می‌شوند، ثبت دستی مدیریتی هستند. اتصال خودکار سفارش‌های checkout فروشگاه، مرحلهٔ جداگانهٔ یکپارچه‌سازی فروشگاه است.</p></div><div class="panel"><h2>آخرین سفارش‌ها</h2>${data.orders.length?tableOrders(data.orders.slice(-5).reverse()):'<div class="empty">هنوز سفارشی ثبت نشده است.</div>'}</div>`}
function tableOrders(list){return `<div class="tablewrap"><table><tr><th>مشتری</th><th>شماره تماس</th><th>مبلغ</th><th>تاریخ</th><th>وضعیت</th></tr>${list.map(o=>`<tr><td>${esc(o.customer)}</td><td>${esc(o.phone)}</td><td>${money(o.total)}</td><td>${esc(o.date)}</td><td><span class="tag">${esc(o.status)}</span></td></tr>`).join('')}</table></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function orders(){const list=[...data.orders].reverse().filter(o=>(o.customer+' '+o.phone).includes(query));return `<div class="panel"><div class="toolbar"><input id="search" placeholder="جستجوی مشتری یا شماره تماس" value="${esc(query)}"><button data-action="new-order">سفارش جدید</button></div>${list.length?'<div class="tablewrap"><table><tr><th>مشتری</th><th>شماره</th><th>شرح</th><th>مبلغ</th><th>تاریخ</th><th>وضعیت</th><th>عملیات</th></tr>'+list.map(o=>`<tr><td>${esc(o.customer)}</td><td>${esc(o.phone)}</td><td>${esc(o.description)}</td><td>${money(o.total)}</td><td>${esc(o.date)}</td><td><select data-order-status="${o.id}">${STATUSES.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="danger" data-delete-order="${o.id}">حذف</button></td></tr>`).join('')+'</table></div>':'<div class="empty">سفارشی پیدا نشد.</div>'}</div>`}
function invoices(){const list=[...data.invoices].reverse().filter(o=>(o.customer+' '+o.phone).includes(query));return `<div class="panel"><div class="toolbar"><input id="search" placeholder="جستجوی مشتری" value="${esc(query)}"><button data-action="new-invoice">پیش‌فاکتور جدید</button></div>${list.length?'<div class="tablewrap"><table><tr><th>شماره</th><th>مشتری</th><th>شرح</th><th>مبلغ</th><th>وضعیت</th><th>عملیات</th></tr>'+list.map(v=>`<tr><td>${fa(v.id)}</td><td>${esc(v.customer)}<small class="muted"> ${esc(v.phone)}</small></td><td>${esc(v.description)}</td><td>${money(v.total)}</td><td><select data-invoice-status="${v.id}">${INVOICE_STATUSES.map(s=>`<option ${s===v.status?'selected':''}>${s}</option>`).join('')}</select></td><td><div class="actions"><button class="light" data-copy-invoice="${v.id}">کپی متن</button><button class="danger" data-delete-invoice="${v.id}">حذف</button></div></td></tr>`).join('')+'</table></div>':'<div class="empty">پیش‌فاکتوری ثبت نشده است.</div>'}</div>`}
function messages(){return `<div class="toolbar"><button data-action="new-message">پیام جدید</button></div>${data.messages.length?data.messages.map(m=>`<div class="panel"><h2>${esc(m.title)}</h2><p style="white-space:pre-wrap">${esc(m.body)}</p><div class="actions"><button class="light" data-copy-message="${m.id}">کپی متن</button><button class="light" data-edit-message="${m.id}">ویرایش</button><button class="danger" data-delete-message="${m.id}">حذف</button></div></div>`).join(''):'<div class="panel empty">پیامی ذخیره نشده است.</div>'}`}
function customers(){const map={};data.orders.forEach(o=>{const k=o.phone||o.customer;const c=map[k]||(map[k]={name:o.customer,phone:o.phone,count:0,total:0});c.count++;if(o.status!=='لغو')c.total+=Number(o.total||0)});const list=Object.values(map).sort((a,b)=>b.total-a.total);return `<div class="panel">${list.length?'<div class="tablewrap"><table><tr><th>نام</th><th>شماره</th><th>سفارش‌ها</th><th>خرید ثبت‌شده</th></tr>'+list.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${fa(c.count)}</td><td>${money(c.total)}</td></tr>`).join('')+'</table></div>':'<div class="empty">مشتری‌ها از سفارش‌های ثبت‌شده استخراج می‌شوند.</div>'}</div>`}
function render(){nav();$('view').innerHTML=({dash,orders,invoices,messages,customers})[view]()}
function dialog(html){const d=$('dlg');d.innerHTML=html;d.showModal();return d}
function nextId(a){return a.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1}
function orderForm(){const d=dialog('<h2>ثبت سفارش</h2><label>نام مشتری</label><input id="f-customer"><label>شماره تماس</label><input id="f-phone" inputmode="tel"><label>شرح سفارش</label><input id="f-description"><label>مبلغ کل (تومان)</label><input id="f-total" type="number" min="1"><div class="dialog-actions"><button id="ok">ثبت</button><button class="light" id="cancel">انصراف</button></div>');d.querySelector('#cancel').onclick=()=>d.close();d.querySelector('#ok').onclick=async()=>{const customer=d.querySelector('#f-customer').value.trim(),phone=d.querySelector('#f-phone').value.trim(),description=d.querySelector('#f-description').value.trim(),total=Number(d.querySelector('#f-total').value);if(!customer||!phone||!total||total<1){alert('نام، شماره تماس و مبلغ معتبر را وارد کن.');return}data.orders.push({id:nextId(data.orders),customer,phone,description,total,status:'جدید',date:new Date().toISOString().slice(0,10)});await save();d.close()}}
function invoiceForm(){const d=dialog('<h2>پیش‌فاکتور جدید</h2><label>نام مشتری</label><input id="f-customer"><label>شماره تماس یا شناسه تماس</label><input id="f-phone"><label>شرح اقلام</label><textarea id="f-description"></textarea><label>مبلغ کل (تومان)</label><input id="f-total" type="number" min="1"><div class="dialog-actions"><button id="ok">ذخیره</button><button class="light" id="cancel">انصراف</button></div>');d.querySelector('#cancel').onclick=()=>d.close();d.querySelector('#ok').onclick=async()=>{const customer=d.querySelector('#f-customer').value.trim(),phone=d.querySelector('#f-phone').value.trim(),description=d.querySelector('#f-description').value.trim(),total=Number(d.querySelector('#f-total').value);if(!customer||!total||total<1){alert('نام مشتری و مبلغ معتبر لازم است.');return}data.invoices.push({id:nextId(data.invoices),customer,phone,description,total,status:'پیش‌نویس',date:new Date().toISOString().slice(0,10)});await save();d.close()}}
function messageForm(m){m=m||{};const d=dialog('<h2>پیام</h2><label>عنوان</label><input id="f-title" value="'+esc(m.title||'')+'"><label>متن</label><textarea id="f-body">'+esc(m.body||'')+'</textarea><div class="dialog-actions"><button id="ok">ذخیره</button><button class="light" id="cancel">انصراف</button></div>');d.querySelector('#cancel').onclick=()=>d.close();d.querySelector('#ok').onclick=async()=>{const title=d.querySelector('#f-title').value.trim(),body=d.querySelector('#f-body').value.trim();if(!title||!body){alert('عنوان و متن پیام لازم است.');return}if(m.id){const old=data.messages.find(x=>x.id===m.id);Object.assign(old,{title,body})}else data.messages.push({id:nextId(data.messages),title,body});await save();d.close()}}
async function copyText(t){try{await navigator.clipboard.writeText(t);status('متن کپی شد.')}catch{prompt('متن را کپی کن:',t)}}
document.addEventListener('click',async e=>{const tab=e.target.closest('[data-view]');if(tab){view=tab.dataset.view;query='';render();return}const go=e.target.closest('[data-go]');if(go){view=go.dataset.go;render();return}const b=e.target.closest('[data-action]');if(b){if(b.dataset.action==='new-order')orderForm();if(b.dataset.action==='new-invoice')invoiceForm();if(b.dataset.action==='new-message')messageForm();return}
if(e.target.dataset.deleteOrder){if(confirm('این سفارش حذف شود؟')){data.orders=data.orders.filter(x=>x.id!==Number(e.target.dataset.deleteOrder));await save()}}
if(e.target.dataset.deleteInvoice){if(confirm('این پیش‌فاکتور حذف شود؟')){data.invoices=data.invoices.filter(x=>x.id!==Number(e.target.dataset.deleteInvoice));await save()}}
if(e.target.dataset.deleteMessage){if(confirm('این پیام حذف شود؟')){data.messages=data.messages.filter(x=>x.id!==Number(e.target.dataset.deleteMessage));await save()}}
if(e.target.dataset.editMessage)messageForm(data.messages.find(x=>x.id===Number(e.target.dataset.editMessage)));
if(e.target.dataset.copyMessage){const m=data.messages.find(x=>x.id===Number(e.target.dataset.copyMessage));await copyText(m.body)}
if(e.target.dataset.copyInvoice){const v=data.invoices.find(x=>x.id===Number(e.target.dataset.copyInvoice));await copyText('پیش‌فاکتور شماره '+fa(v.id)+'\nمشتری: '+v.customer+'\n'+v.description+'\nجمع کل: '+money(v.total))}
});
document.addEventListener('change',async e=>{if(e.target.dataset.orderStatus){const o=data.orders.find(x=>x.id===Number(e.target.dataset.orderStatus));if(o){o.status=e.target.value;await save()}}if(e.target.dataset.invoiceStatus){const v=data.invoices.find(x=>x.id===Number(e.target.dataset.invoiceStatus));if(v){v.status=e.target.value;await save()}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const p=e.target.selectionStart;render();const n=$('search');if(n){n.focus();n.setSelectionRange(p,p)}}});
$('loginBtn').onclick=async()=>{try{await api('login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});await start()}catch(e){$('loginError').textContent=e.message}};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('logout').onclick=async()=>{try{await api('logout',{method:'POST'});}finally{location.reload()}};
async function start(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');await load()}
(async()=>{try{await load();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden')}catch(e){/* not authenticated yet */}})();
</script>
</body></html>
