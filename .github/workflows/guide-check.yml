name: CHAYSA guide checks

on:
  push:
    branches:
      - feature/home-guide-layout-2026-11-16
      - feature/health-online-approval-2026-11-16
      - feature/admin-letter-composer-2026-11-16
      - feature/telegram-inline-letter-receipt-2026-11-16
      - feature/rubika-order-messaging-2026-11-17\n      - fix/rubika-webhook-started-event-2026-11-17
  pull_request:
    branches:
      - chaysa-backup
    paths:
      - "server.js"
      - "health-advisor.html"
      - "health-bank.js"
      - "health-research-queue.js"
      - "data/health/**"
      - "content/**"
      - "products.html"
      - "admin.html"
      - "health-approval.html"
      - "letter-receipt.html"
      - "docs/CHAYSA_PROJECT_MASTER.md"
      - "docs/CHAYSA_SYSTEM_SPEC.md"
      - "guide.js"
      - "guide-bank.json"
      - "test/**"
      - "package.json"
      - ".github/workflows/guide-check.yml"

jobs:
  guide-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check server JavaScript syntax
        run: node --check server.js
      - name: Check health research queue JavaScript syntax
        run: node --check health-research-queue.js
      - name: Check admin inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('admin.html').read_text(encoding='utf-8')
          scripts = source.split('<script>')
          if len(scripts) < 2:
              raise SystemExit('admin inline script not found')
          Path('/tmp/chaysa-admin.js').write_text(scripts[-1].split('</script>', 1)[0], encoding='utf-8')
          PY
          node --check /tmp/chaysa-admin.js
      - name: Check receipt page inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('letter-receipt.html').read_text(encoding='utf-8')
          scripts = source.split('<script>')
          if len(scripts) < 2:
              raise SystemExit('receipt inline script not found')
          Path('/tmp/chaysa-letter-receipt.js').write_text(scripts[-1].split('</script>', 1)[0], encoding='utf-8')
          PY
          node --check /tmp/chaysa-letter-receipt.js
      - name: Check health approval page inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('health-approval.html').read_text(encoding='utf-8')
          scripts = source.split('<script>')
          if len(scripts) < 2:
              raise SystemExit('health approval inline script not found')
          Path('/tmp/chaysa-health-approval.js').write_text(scripts[-1].split('</script>', 1)[0], encoding='utf-8')
          PY
          node --check /tmp/chaysa-health-approval.js
      - name: Run guide API tests
        run: npm run test:guide
