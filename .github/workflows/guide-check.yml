name: CHAYSA guide checks

on:
  push:
    branches:
      - feature/home-guide-layout-2026-11-16
  pull_request:
    branches:
      - chaysa-backup
    paths:
      - "server.js"
      - "guide.js"
      - "guide-bank.json"
      - "test/**"
      - "package.json"
      - ".github/workflows/guide-check.yml"

jobs:
  guide-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check server JavaScript syntax
        run: node --check server.js
      - name: Run guide API tests
        run: npm run test:guide
