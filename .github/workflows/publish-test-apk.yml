name: Publish CHAYSA test APK
on:
  push:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract the approved test build
        run: |
          set -euo pipefail
          curl -fL --retry 3 --output /tmp/chaysa-artifact.zip 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-22a8-81f4-8f54-59e4c49f30c5/raw?se=2026-11-15T15%3A35%3A23Z&sp=r&sv=2026-06-06&sr=b&scid=ab1973f9-ee1c-5fda-9323-941c9f4587df&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-15T09%3A42%3A57Z&ske=2026-11-16T09%3A42%3A57Z&sks=b&skv=2026-06-06&sig=xUnCFj%2B48OX29h1wLoxyGXSU5PA8N7qJZPhddON96/g%3D'
          unzip -l /tmp/chaysa-artifact.zip
          mkdir -p downloads
          unzip -j /tmp/chaysa-artifact.zip 'app-release.apk' -d downloads
          test -s downloads/app-release.apk
          mv downloads/app-release.apk downloads/chaysa-test-arm64.apk
          ls -lh downloads/chaysa-test-arm64.apk
      - name: Publish the APK as a public download
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/chaysa-test-arm64.apk
          git commit -m "Publish CHAYSA test APK"
          git push
