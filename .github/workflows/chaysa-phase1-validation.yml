name: CHAYSA Phase 1 validation

on:
  push:
    branches:
      - fix/chaysa-phase1-findings-remediation-2026-11-20
  pull_request:
    branches:
      - chaysa-backup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaysa-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete test suite
        run: npm test
