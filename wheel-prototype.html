<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#24170d"><title>گردونهٔ چایسا | نمونهٔ آزمایشی</title>
<style>
:root{--gold:#dba94d;--gold2:#fff0b7;--cream:#fff3d8;--ink:#23452b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--cream);font-family:Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at 50% 28%,#a65b20 0,#5b351b 34%,#24150d 72%,#100a06 100%);overflow-x:hidden}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 20%,#08050288 100%),repeating-linear-gradient(115deg,transparent 0 80px,#ffda8b08 81px 82px)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 8% 16%,#ffb42c88 0 3px,transparent 8px),radial-gradient(circle at 87% 11%,#ffb42c88 0 4px,transparent 10px),radial-gradient(circle at 14% 70%,#ffcb5c77 0 2px,transparent 7px),radial-gradient(circle at 91% 65%,#ffcb5c77 0 3px,transparent 8px);filter:blur(1px)}
header{text-align:center;padding:20px 12px 0;position:relative;z-index:2}
.eyebrow{font-size:10px;letter-spacing:4px;color:#f0c66e;text-shadow:0 0 12px #f7b93e}
h1{font-size:clamp(23px,5vw,34px);margin:8px 0 5px;color:#fff0c9;font-weight:600;text-shadow:0 2px 12px #0008}
header p{font-size:12px;color:#f1d8a8;margin:0}
main{width:min(100%,600px);margin:auto;padding:8px 10px 30px;text-align:center}
.stage{position:relative;width:min(96vw,490px);height:660px;margin:0 auto;isolation:isolate;filter:drop-shadow(0 22px 25px #0008)}
.table{position:absolute;z-index:-2;bottom:4px;left:-8vw;width:116vw;height:125px;background:repeating-linear-gradient(3deg,#28160c 0 9px,#39200f 10px 13px,#211208 14px 18px);box-shadow:0 -15px 35px #d58b2b22,inset 0 12px 22px #0009}
.glow{position:absolute;top:500px;left:50%;transform:translateX(-50%);width:240px;height:75px;border-radius:50%;background:#ffb52b44;filter:blur(23px)}
.steam{position:absolute;z-index:0;top:-5px;left:50%;width:170px;height:140px;transform:translateX(-50%);opacity:.8;filter:blur(2px)}
.steam:before,.steam:after{content:"";position:absolute;bottom:0;width:65px;height:130px;border-radius:50%;border-left:6px solid #fff0d099;transform:rotate(20deg);filter:blur(3px);animation:steamrise 4s ease-in-out infinite alternate}
@keyframes steamrise{from{transform:translateY(8px) rotate(16deg);opacity:.45}to{transform:translateY(-13px) rotate(27deg);opacity:.95}}
.steam:after{left:70px;height:110px;transform:rotate(-22deg);border-color:#fff0d066}
.leaf{position:absolute;z-index:0;width:54px;height:24px;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#b8d75d,#456e24 70%,#203b17);box-shadow:inset 0 1px 2px #e7f3a5,0 5px 12px #0008;transform:rotate(-35deg)}
.leaf:after{content:"";position:absolute;left:5px;top:12px;width:46px;height:1px;background:#d4e98b99;transform:rotate(-12deg)}
.leaf.one{top:55px;left:3%;transform:rotate(30deg)}.leaf.two{top:170px;right:0;transform:rotate(145deg)}.leaf.three{top:465px;left:0;transform:rotate(-12deg)}
.pointer{position:absolute;z-index:12;top:34px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:39px solid #ffdf86;filter:drop-shadow(0 3px 3px #241305) drop-shadow(0 0 8px #ffc24d)}
.saucer-shadow{position:absolute;top:47px;left:50%;transform:translateX(-50%);width:min(94vw,455px);height:min(94vw,455px);border-radius:50%;background:#080502;filter:blur(18px);opacity:.8}
.rim{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:min(95vw,465px);height:min(95vw,465px);border-radius:50%;padding:14px;background:radial-gradient(ellipse at 30% 18%,#fffef2 0,#f7e9c6 17%,#e7c47d 35%,#9b682e 55%,#f8dfa0 72%,#8a541e 88%,#fff0bd 94%,#704319 100%);box-shadow:0 24px 35px #000d,inset 0 5px 8px #fff,inset 0 -10px 17px #5b350e,0 0 25px #f6b84b44}
.rim:before{content:"";position:absolute;inset:5px;border-radius:50%;border:2px solid #fff7d8;box-shadow:0 0 0 3px #9b692b,inset 0 0 9px #fff,0 0 0 7px #e4bd70}
.rim:after{content:"";position:absolute;inset:11px;border-radius:50%;border:1px solid #fff9e0;box-shadow:inset 0 0 8px #fff8;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg 20deg,#64834a22 20.5deg 21.5deg,transparent 22deg 45deg);mask:radial-gradient(circle,transparent 0 79%,#000 80% 100%)}
.rotor{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;border:4px solid #fff1ca;background:conic-gradient(from -22.5deg,#741a3a 0 45deg,#f3d9a5 45deg 90deg,#28723a 90deg 135deg,#78305f 135deg 180deg,#741a3a 180deg 225deg,#f3d9a5 225deg 270deg,#28723a 270deg 315deg,#78305f 315deg 360deg);transition:transform 5.6s cubic-bezier(.12,.72,.08,1);box-shadow:inset 0 0 0 4px #e8c27a,inset 0 0 35px #321607, inset 0 0 90px #fff3}
.rotor{background-image:radial-gradient(ellipse at 28% 20%,#ffffff55,transparent 43%),radial-gradient(ellipse at 70% 78%,#16080755,transparent 50%),conic-gradient(from -22.5deg,#741a3a 0 45deg,#f3d9a5 45deg 90deg,#28723a 90deg 135deg,#78305f 135deg 180deg,#741a3a 180deg 225deg,#f3d9a5 225deg 270deg,#28723a 270deg 315deg,#78305f 315deg 360deg)}
.rotor:before{content:"";position:absolute;inset:7px;border-radius:50%;border:2px solid #f6e3b2;pointer-events:none}
.rotor:after{content:"";position:absolute;inset:21%;border-radius:50%;border:2px solid #f7df9b66;pointer-events:none}
.segment{position:absolute;left:50%;top:50%;width:126px;margin-left:-63px;margin-top:-22px;text-align:center;font-size:clamp(10px,2.6vw,13px);line-height:1.45;font-weight:bold;color:#fff9e9;text-shadow:0 2px 3px #2b160c,0 0 8px #351609;transform:rotate(var(--a)) translateY(-116px) rotate(calc(var(--a)*-1));}
.segment .symbol{display:block;font-size:25px;line-height:1.25;margin-bottom:3px;filter:drop-shadow(0 2px 2px #371b0a)}
.brand{position:absolute;left:50%;top:50%;width:88px;margin-left:-44px;margin-top:-8px;text-align:center;font:bold 12px Arial,sans-serif;letter-spacing:.5px;color:#21452a;text-shadow:0 1px #fff7;transform:rotate(var(--a)) translateY(-202px) rotate(calc(var(--a)*-1))}
.hub{position:absolute;z-index:14;left:50%;top:50%;transform:translate(-50%,-50%);width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 35% 22%,#fffdf0,#f7e5bd 60%,#d3a85b);border:5px solid #fff0c7;box-shadow:0 5px 15px #2c160b99,0 0 0 4px #9b672b, inset 0 0 12px #b17a2c;display:grid;place-items:center}
.hub img{width:94px;height:94px;object-fit:contain;border-radius:50%;background:#fff8e8}
.cup{position:absolute;z-index:-1;top:435px;left:50%;transform:translateX(-50%);width:300px;height:175px;border-radius:12% 12% 43% 43% / 5% 5% 36% 36%;background:radial-gradient(ellipse at 50% 58%,#fffef3 0,#fff9e8 46%,#eee0c4 76%,#b99a6b 100%);border:2px solid #fff1ce;box-shadow:inset 8px 0 12px #fff,inset -12px 0 18px #9b805655,inset 0 -14px 18px #b49a7188,0 17px 20px #0009;overflow:hidden}
.cup{background-image:radial-gradient(circle at 20% 48%,#b65d5a 0 2px,transparent 2.8px),radial-gradient(circle at 23% 46%,#6b8b52 0 1.6px,transparent 2.3px),radial-gradient(circle at 26% 50%,#c79a42 0 1.5px,transparent 2.2px),radial-gradient(circle at 76% 61%,#b65d5a 0 2px,transparent 2.8px),radial-gradient(circle at 73% 58%,#6b8b52 0 1.6px,transparent 2.3px),radial-gradient(circle at 79% 65%,#c79a42 0 1.5px,transparent 2.2px),radial-gradient(ellipse at 50% 58%,#fffef3 0,#fff9e8 46%,#eee0c4 76%,#b99a6b 100%)}
.cup:before{content:"";position:absolute;top:-9px;left:-2%;width:104%;height:38px;border-radius:50%;background:linear-gradient(180deg,#fffbe9,#d8b878 45%,#8c5b2b 70%,#f7e6bd);border:3px solid #fff0c2;box-shadow:inset 0 3px 6px #fff,0 5px 8px #4a270e}
.cup:after{content:"✿  ❀  ✿";position:absolute;top:65px;left:0;width:100%;text-align:center;color:#6d8b50;font-size:30px;letter-spacing:13px;text-shadow:0 1px #fff,0 2px 4px #8b6b3b}
.cup:before{content:"";position:absolute;top:9px;left:10%;width:80%;height:35px;border-radius:50%;background:linear-gradient(#7b4b20,#d7b46c);border:4px solid #fff0c2}
.cup:after{content:"❧  ❧  ❧";position:absolute;top:75px;left:0;width:100%;text-align:center;color:#31552c;font-size:34px;text-shadow:0 1px #fff4}
.handle{position:absolute;z-index:-2;top:463px;left:calc(50% + 112px);width:108px;height:90px;border:17px solid #d8c7a4;border-left-color:#fff8e9;border-right-color:#fff8e9;border-radius:20% 65% 65% 20%;box-shadow:inset 0 0 9px #fff9,0 5px 8px #0008;filter:drop-shadow(3px 7px 5px #0009)}
.cup-base{position:absolute;z-index:-1;top:586px;left:50%;transform:translateX(-50%);width:230px;height:25px;border-radius:50%;background:linear-gradient(#fff0c2,#d4aa5d 45%,#75481d);box-shadow:0 10px 14px #000b,inset 0 2px 3px #fff}
.sugar-wrap{position:absolute;z-index:20;top:616px;left:50%;transform:translateX(-50%)}
.sugar{border:0;cursor:pointer;position:relative;width:132px;height:65px;border-radius:12px;background:linear-gradient(145deg,#fffdf4 0,#f5ead0 55%,#cbb88f 100%);color:#24502c;font-family:inherit;font-weight:bold;font-size:19px;box-shadow:0 9px 0 #8d7958,0 15px 23px #000b,inset 0 3px 6px #fff;transform:perspective(90px) rotateX(5deg);transition:transform .15s,box-shadow .15s;text-shadow:0 1px #fff}
.sugar:before{content:"";position:absolute;left:8px;right:8px;top:-9px;height:17px;border-radius:7px;background:linear-gradient(90deg,#fffdf3,#dfd1ae);transform:skewY(-3deg)}
.sugar:after{content:"✦  ✦  ✦";position:absolute;top:-28px;left:0;width:100%;font-size:15px;color:#ffc43e;text-shadow:0 0 9px #ffb42b}
.sugar:active{transform:translateY(6px);box-shadow:0 3px 0 #8d7958,0 7px 12px #0009}.sugar:disabled{opacity:.75;cursor:wait}
.hint{font-size:12px;color:#f3dcae;margin:17px 0 0}.counter{display:inline-block;margin-top:10px;padding:8px 15px;border:1px solid #c18d3f;border-radius:30px;color:#fff0c8;font-size:12px;background:#24170dcc}
.result{min-height:60px;margin:12px auto 0;padding:12px 15px;max-width:430px;border:1px solid #c18d3f;border-radius:14px;background:linear-gradient(135deg,#56351b,#24170f);color:#fff0ce;line-height:1.8;font-size:14px;box-shadow:0 8px 22px #0005}
.note{max-width:440px;margin:13px auto 0;color:#d1b98f;font-size:10px;line-height:1.9}
@media(max-width:390px){.stage{height:630px}.rim{top:27px}.cup{top:408px;width:275px}.handle{top:438px;left:calc(50% + 102px)}.cup-base{top:550px}.sugar-wrap{top:580px}.segment{transform:rotate(var(--a)) translateY(-104px) rotate(calc(var(--a)*-1));font-size:10px}.brand{transform:rotate(var(--a)) translateY(-180px) rotate(calc(var(--a)*-1));font-size:10px}.hub{width:104px;height:104px}.hub img{width:82px;height:82px}}
</style></head>
<body>
<header><div class="eyebrow">CHAYSA · TEA & MOMENTS</div><h1>گردونهٔ شانس چایسا</h1><p>یک چرخش، یک لحظهٔ شیرین</p></header>
<main>
<div class="stage" aria-label="گردونهٔ آزمایشی چایسا">
<div class="table"></div><div class="glow"></div><div class="steam"></div><i class="leaf one"></i><i class="leaf two"></i><i class="leaf three"></i>
<div class="saucer-shadow"></div><div class="pointer"></div>
<div class="rim"><div class="rotor" id="wheel"></div><div class="hub"><img src="https://raw.githubusercontent.com/shahab11350/chaysapp-android/main/assets/chaysa_logo.png" alt="لوگوی اصلی چایسا"></div></div>
<div class="handle"></div><div class="cup"></div><div class="cup-base"></div>
<div class="sugar-wrap"><button class="sugar" id="spin">بچرخون!</button></div>
</div>
<div class="hint">برای شروع، حبه‌قند را لمس کن</div><div class="counter" id="counter">فرصت آزمایشی: ۲ از ۲</div>
<div class="result" id="result" aria-live="polite">آماده‌ای یک جایزه را کشف کنی؟</div>
<p class="note">این نسخه فقط نمونهٔ نمایشیِ ظاهر و حرکت است. نتیجه‌ها تصادفی و آزمایشی‌اند و هنوز به سفارش، پرداخت یا سامانهٔ جوایز واقعی متصل نیستند.</p>
</main>
<script>
const prizes=[
["جایزهٔ ویژهٔ چایسا","🎁"],["تخفیف خرید","🏷️"],["محصول رایگان","🍃"],["پوچ","☕"],
["جایزهٔ نقدی","💰"],["پوچ","☕"],["انتخاب محصول با تخفیف","🎀"],["کمک به خیریه به نام برنده","💚"]
];
const wheel=document.getElementById('wheel');
prizes.forEach(([p,icon],i)=>{
 const a=i*45;
 const label=document.createElement('div');label.className='segment';label.style.setProperty('--a',a+'deg');label.innerHTML='<span class="symbol">'+icon+'</span>'+p;wheel.appendChild(label);
 const brand=document.createElement('div');brand.className='brand';brand.style.setProperty('--a',(a+22.5)+'deg');brand.textContent=i%2===0?'Taksoo':'Chaysa';wheel.appendChild(brand);
});
let remaining=2,rotation=0,busy=false;
const btn=document.getElementById('spin'),result=document.getElementById('result'),counter=document.getElementById('counter');
btn.addEventListener('click',()=>{
 if(busy||remaining<=0)return;busy=true;remaining--;btn.disabled=true;
 counter.textContent='فرصت آزمایشی: '+remaining+' از ۲';
 const index=Math.floor(Math.random()*prizes.length);
 const target=360-(index*45)+360*6;rotation+=target;wheel.style.transform='rotate('+rotation+'deg)';
 result.textContent='چرخ در حال چرخش است…';
 setTimeout(()=>{result.textContent='نتیجهٔ آزمایشی: '+prizes[index][0];busy=false;btn.disabled=remaining<=0;if(!remaining)counter.textContent='هر دو فرصت آزمایشی استفاده شد'},5850);
});
</script></body></html>
