<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24170d"><title>گردونهٔ سه‌بعدی چایسا</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff0d0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at 50% 25%,#9a5929,#4b2d1b 52%,#140c07);overflow-x:hidden}header{text-align:center;padding:18px 10px 0}header small{letter-spacing:4px;color:#f0c66e;font-size:10px}h1{font-size:clamp(23px,5vw,34px);margin:8px 0 5px;color:#fff1d1;text-shadow:0 3px 12px #0009}header p{font-size:12px;color:#e8c99a;margin:0}main{width:min(100%,650px);margin:auto;text-align:center;padding:0 8px 28px}#scene{display:block;width:min(100vw,600px);height:min(112vw,660px);min-height:460px;margin:auto;touch-action:pan-y;filter:drop-shadow(0 20px 24px #0008)}.controls{margin-top:-10px;position:relative}.sugar{border:1px solid #fff8e8;border-radius:12px;padding:15px 36px;background:linear-gradient(145deg,#fffef6,#eadbbd 60%,#bda77d);color:#31512d;font:bold 18px Tahoma;box-shadow:0 7px 0 #796343,0 13px 22px #0009,inset 0 2px 5px #fff;cursor:pointer}.sugar:active{transform:translateY(5px);box-shadow:0 2px 0 #796343,0 7px 12px #0009}.sugar:disabled{opacity:.65;cursor:wait}.hint{font-size:12px;color:#f0d9ae;margin:15px 0 0}.counter{display:inline-block;margin-top:10px;padding:8px 15px;border:1px solid #c18d3f;border-radius:30px;color:#fff0c8;font-size:12px;background:#24170dcc}.result{min-height:55px;margin:12px auto 0;padding:12px 15px;max-width:440px;border:1px solid #c18d3f;border-radius:14px;background:linear-gradient(135deg,#56351b,#24170f);color:#fff0ce;line-height:1.8;font-size:14px}.note{max-width:440px;margin:13px auto;color:#d1b98f;font-size:10px;line-height:1.9}
</style></head><body>
<header><small>CHAYSA · TEA & MOMENTS</small><h1>گردونهٔ شانس چایسا</h1><p>یک چرخش، یک لحظهٔ شیرین</p></header><main>
<canvas id="scene" aria-label="گردونه سه‌بعدی روی نعلبکی چینی سفید و گل‌دار"></canvas>
<div class="controls"><button class="sugar" id="spin">بچرخون!</button></div><div class="hint">برای شروع، حبه‌قند را لمس کن</div><div class="counter" id="counter">فرصت آزمایشی: ۲ از ۲</div><div class="result" id="result">آماده‌ای یک جایزه را کشف کنی؟</div><p class="note">این نسخه نمونهٔ نمایشی است؛ نتیجه‌ها تصادفی و آزمایشی‌اند و هنوز به سفارش، پرداخت یا سامانهٔ جوایز واقعی متصل نیستند.</p>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#scene'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(34,1,.1,100);camera.position.set(0,6.7,11.8);camera.lookAt(0,.25,0);
scene.add(new THREE.HemisphereLight(0xfff2d8,0x45220e,2));
const key=new THREE.DirectionalLight(0xffe5bd,3.2);key.position.set(-4,8,6);scene.add(key);
const fill=new THREE.PointLight(0xffb94f,65,18);fill.position.set(4,3,4);scene.add(fill);
const gold=new THREE.MeshStandardMaterial({color:0xc99a43,metalness:.78,roughness:.22});
const china=new THREE.MeshPhysicalMaterial({color:0xfffdf4,roughness:.16,metalness:.02,clearcoat:1,clearcoatRoughness:.08});
function floralTexture(){const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');x.fillStyle='#fffdf5';x.fillRect(0,0,1024,512);
for(let row=0;row<4;row++)for(let col=0;col<9;col++){let px=col*120+48+(row%2)*24,py=row*124+55;x.save();x.translate(px,py);x.rotate(((row*9+col)%5-2)*.12);for(let p=0;p<5;p++){let a=p*Math.PI*2/5;x.beginPath();x.ellipse(Math.cos(a)*10,Math.sin(a)*10,6,9,a,0,Math.PI*2);x.fillStyle=['#d98b9a','#e6a2ad','#c96f83'][p%3];x.fill()}x.beginPath();x.arc(0,0,3,0,7);x.fillStyle='#d6ad53';x.fill();x.strokeStyle='#668653';x.lineWidth=2;x.beginPath();x.moveTo(0,10);x.quadraticCurveTo(12,26,25,22);x.stroke();x.beginPath();x.ellipse(20,20,5,9,.8,0,7);x.fillStyle='#78945c';x.fill();x.restore()}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const floral=new THREE.MeshPhysicalMaterial({map:floralTexture(),roughness:.22,clearcoat:.9});
const base=new THREE.Group();scene.add(base);base.position.y=-.75;
// A hollow, tapered porcelain cup pedestal beneath the saucer.
const cupProfile=[new THREE.Vector2(.48,0),new THREE.Vector2(.58,.10),new THREE.Vector2(.70,.25),new THREE.Vector2(.91,.58),new THREE.Vector2(1.08,1.02),new THREE.Vector2(1.12,1.30),new THREE.Vector2(1.08,1.37),new THREE.Vector2(1.01,1.31),new THREE.Vector2(.98,1.05),new THREE.Vector2(.80,.62),new THREE.Vector2(.62,.32),new THREE.Vector2(.48,.18)];
const cup=new THREE.Mesh(new THREE.LatheGeometry(cupProfile,96),floral);base.add(cup);
const cupLip=new THREE.Mesh(new THREE.TorusGeometry(1.08,.045,16,96),gold);cupLip.rotation.x=Math.PI/2;cupLip.position.y=1.34;base.add(cupLip);
const foot=new THREE.Mesh(new THREE.TorusGeometry(.51,.055,16,80),gold);foot.rotation.x=Math.PI/2;foot.position.y=.06;base.add(foot);
const handlePath=new THREE.CatmullRomCurve3([new THREE.Vector3(1.0,1.05,0),new THREE.Vector3(1.42,1.12,0),new THREE.Vector3(1.75,.92,0),new THREE.Vector3(1.78,.57,0),new THREE.Vector3(1.52,.32,0),new THREE.Vector3(1.05,.42,0)]);
base.add(new THREE.Mesh(new THREE.TubeGeometry(handlePath,64,.095,16,false),china));
// Broad, shallow saucer: a visible flat plate with a gently raised rim.
const saucer=new THREE.Group();scene.add(saucer);saucer.position.y=.67;
const saucerProfile=[new THREE.Vector2(0,0),new THREE.Vector2(.7,.015),new THREE.Vector2(1.35,.025),new THREE.Vector2(1.8,.055),new THREE.Vector2(2.08,.11),new THREE.Vector2(2.22,.18),new THREE.Vector2(2.26,.23),new THREE.Vector2(2.23,.26),new THREE.Vector2(2.16,.22),new THREE.Vector2(2.02,.15),new THREE.Vector2(1.75,.10),new THREE.Vector2(1.25,.075),new THREE.Vector2(.6,.07),new THREE.Vector2(0,.07)];
saucer.add(new THREE.Mesh(new THREE.LatheGeometry(saucerProfile,128),floral));
const rim=new THREE.Mesh(new THREE.TorusGeometry(2.23,.032,12,128),gold);rim.rotation.x=Math.PI/2;rim.position.y=.22;saucer.add(rim);
const innerRim=new THREE.Mesh(new THREE.TorusGeometry(1.83,.014,10,128),gold);innerRim.rotation.x=Math.PI/2;innerRim.position.y=.09;saucer.add(innerRim);
// Rotating eight-part prize plate, inset within the broad visible saucer.
const rotor=new THREE.Group();saucer.add(rotor);rotor.position.y=.285;
const prizes=['جایزهٔ ویژه','تخفیف خرید','محصول رایگان','پوچ','جایزهٔ نقدی','پوچ','انتخاب محصول','کمک خیریه'];
const colors=[0x87314b,0xe9d6b1,0x47734b,0x81516e,0x87314b,0xe9d6b1,0x47734b,0x81516e];
for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,b=a+Math.PI/4,shape=new THREE.Shape();shape.moveTo(0,0);shape.absarc(0,0,1.66,a,b,false);shape.lineTo(0,0);const mesh=new THREE.Mesh(new THREE.ShapeGeometry(shape,32),new THREE.MeshPhysicalMaterial({color:colors[i],roughness:.3,clearcoat:.65,side:THREE.DoubleSide}));mesh.rotation.x=-Math.PI/2;mesh.position.y=.025;rotor.add(mesh);
const cv=document.createElement('canvas');cv.width=256;cv.height=100;const cx=cv.getContext('2d');cx.fillStyle='#fff8e8';cx.font='bold 23px Tahoma';cx.textAlign='center';cx.fillText(prizes[i],128,60);const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;const label=new THREE.Mesh(new THREE.PlaneGeometry(.78,.31),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide,depthWrite:false}));label.rotation.x=-Math.PI/2;const m=a+Math.PI/8;label.position.set(Math.cos(m)*1.03,.07,Math.sin(m)*1.03);rotor.add(label);
const brandCanvas=document.createElement('canvas');brandCanvas.width=220;brandCanvas.height=70;const bc=brandCanvas.getContext('2d');bc.fillStyle='#fff6dc';bc.font='bold 26px Arial';bc.textAlign='center';bc.fillText(i%2===0?'TAKSOO':'CHAYSA',110,45);const bt=new THREE.CanvasTexture(brandCanvas);const bm=new THREE.Mesh(new THREE.PlaneGeometry(.58,.18),new THREE.MeshBasicMaterial({map:bt,transparent:true,side:THREE.DoubleSide,depthWrite:false}));bm.rotation.x=-Math.PI/2;bm.position.set(Math.cos(m)*1.48,.07,Math.sin(m)*1.48);rotor.add(bm)}
// Fixed central medallion and logo do not rotate with the prize plate.
const medallion=new THREE.Mesh(new THREE.CylinderGeometry(.43,.46,.13,96),gold);medallion.position.set(0,.43,0);saucer.add(medallion);
const logoDisc=new THREE.Mesh(new THREE.CircleGeometry(.39,96),new THREE.MeshBasicMaterial({color:0xfffdf4}));logoDisc.rotation.x=-Math.PI/2;logoDisc.position.set(0,.501,0);saucer.add(logoDisc);
const logo=new THREE.Mesh(new THREE.PlaneGeometry(.66,.66),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true}));logo.rotation.x=-Math.PI/2;logo.position.set(0,.507,0);saucer.add(logo);
new THREE.TextureLoader().load('https://raw.githubusercontent.com/shahab11350/chaysapp-android/main/assets/chaysa_logo.png',t=>{t.colorSpace=THREE.SRGBColorSpace;logo.material.map=t;logo.material.needsUpdate=true});
// Fixed pointer, above the plate's far edge.
const pointer=new THREE.Mesh(new THREE.ConeGeometry(.14,.34,4),new THREE.MeshStandardMaterial({color:0xffd36a,metalness:.7,roughness:.2}));pointer.position.set(0,1.25,-2.12);pointer.rotation.x=Math.PI;scene.add(pointer);
// Decorative 3D sugar cube below the cup; HTML button is its accessible control.
const sugar=new THREE.Mesh(new THREE.BoxGeometry(.58,.48,.58),new THREE.MeshPhysicalMaterial({color:0xfff9e9,roughness:.28,clearcoat:.65}));sugar.position.set(0,-1.85,1.45);sugar.rotation.set(-.15,.2,.08);scene.add(sugar);
const ground=new THREE.Mesh(new THREE.CircleGeometry(5,96),new THREE.MeshStandardMaterial({color:0x392114,roughness:.55}));ground.rotation.x=-Math.PI/2;ground.position.y=-2.2;scene.add(ground);
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
let remaining=2,busy=false,turn=0;const btn=document.querySelector('#spin'),result=document.querySelector('#result'),counter=document.querySelector('#counter');
function draw(){renderer.render(scene,camera);requestAnimationFrame(draw)}draw();
btn.addEventListener('click',()=>{if(busy||remaining<1)return;busy=true;remaining--;btn.disabled=true;counter.textContent='فرصت آزمایشی: '+remaining+' از ۲';const index=Math.floor(Math.random()*8),start=rotor.rotation.y,extra=Math.PI*2*6+(Math.PI*2-(index*Math.PI/4+Math.PI/8));const end=start+extra;const t0=performance.now(),duration=5600;result.textContent='چرخ در حال چرخش است…';function tick(now){const p=Math.min(1,(now-t0)/duration),e=1-Math.pow(1-p,4);rotor.rotation.y=start+(end-start)*e;if(p<1)requestAnimationFrame(tick);else{result.textContent='نتیجهٔ آزمایشی: '+prizes[index];busy=false;btn.disabled=remaining===0;if(!remaining)counter.textContent='هر دو فرصت آزمایشی استفاده شد'}}requestAnimationFrame(tick)});
</script></body></html>
