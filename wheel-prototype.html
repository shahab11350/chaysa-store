<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#21170f">
<title>گردونهٔ چوبی چایسا</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 22%,#654329 0,#302116 55%,#130d08 100%);color:#fff4dc;font-family:Tahoma,Arial,sans-serif;text-align:center}
header{padding:22px 12px 8px}
header small{font:11px Arial,sans-serif;letter-spacing:4px;color:#e5bd75}
h1{font-size:clamp(23px,5vw,32px);margin:9px 0 5px;color:#fff2d5}
header p{font-size:13px;color:#e0c9a4;margin:0}
main{width:min(100%,700px);margin:auto;padding:12px 10px 30px}
.wheel-wrap{position:relative;width:min(94vw,640px);aspect-ratio:1;margin:0 auto}
#wheel{display:block;width:100%;height:100%;filter:drop-shadow(0 16px 20px #0009)}
.pointer{position:absolute;z-index:3;top:-2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid #f5cc78;filter:drop-shadow(0 3px 3px #0009)}
.logo{position:absolute;z-index:2;width:19%;height:19%;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;object-fit:contain;background:#fffdf6;border:5px solid #d5a64f;box-shadow:0 2px 12px #1c1008aa;padding:8px}
.controls{margin:22px auto 0}
#spin{border:1px solid #f1d49a;border-radius:14px;padding:14px 48px;background:linear-gradient(145deg,#e5c58b,#a97839);color:#29190d;font:bold 19px Tahoma;box-shadow:0 6px 0 #63411f,0 12px 22px #0008;cursor:pointer}
#spin:active{transform:translateY(4px);box-shadow:0 2px 0 #63411f,0 6px 12px #0008}
#spin:disabled{opacity:.65;cursor:wait}
.hint{margin:15px 0 0;color:#e5cda7;font-size:12px}
.counter{display:inline-block;margin-top:12px;padding:8px 17px;border:1px solid #b98b4c;border-radius:30px;background:#20150dcc;color:#f9e6c1;font-size:12px}
.result{min-height:54px;max-width:480px;margin:14px auto 0;padding:12px 16px;border:1px solid #b98b4c;border-radius:13px;background:linear-gradient(135deg,#50341e,#21160e);color:#fff0d1;line-height:1.9;font-size:14px}
.note{max-width:470px;margin:14px auto;color:#cbb38d;font-size:10px;line-height:1.9}
</style>
</head>
<body>
<header><small>CHAYSA · TEA & MOMENTS</small><h1>گردونهٔ شانس چایسا</h1><p>هشت گزینه؛ روشن، خوانا و در دسترس</p></header>
<main>
<div class="wheel-wrap" aria-label="گردونهٔ چوبی با هشت جایزه">
 <canvas id="wheel" width="720" height="720" role="img" aria-label="هشت بخش جایزه روی گردونه"></canvas>
 <div class="pointer" aria-hidden="true"></div>
 <img class="logo" src="https://raw.githubusercontent.com/shahab11350/chaysapp-android/main/assets/chaysa_logo.png" alt="لوگوی اصلی چایسا">
</div>
<div class="controls"><button id="spin" type="button">شروع</button></div>
<div class="hint">برای چرخاندن گردونه، دکمهٔ شروع را بزن.</div>
<div class="counter" id="counter">فرصت آزمایشی: ۲ از ۲</div>
<div class="result" id="result" aria-live="polite">آماده‌ای یک جایزه را کشف کنی؟</div>
<p class="note">این نسخه فقط نمونهٔ نمایشی است؛ نتیجه‌ها تصادفی و آزمایشی‌اند و هنوز به سفارش، پرداخت یا سامانهٔ جوایز واقعی متصل نیستند.</p>
</main>
<script>
(() => {
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d');
const spinBtn=document.getElementById('spin'),result=document.getElementById('result'),counter=document.getElementById('counter');
const prizes=[
 {lines:['جایزهٔ ویژه','لوگوی چایسا'],brand:'TAKSOO'},
 {lines:['تخفیف خرید'],brand:'CHAYSA'},
 {lines:['محصول رایگان'],brand:'TAKSOO'},
 {lines:['پوچ'],brand:'CHAYSA'},
 {lines:['جایزهٔ نقدی'],brand:'TAKSOO'},
 {lines:['پوچ'],brand:'CHAYSA'},
 {lines:['انتخاب محصول','دلخواه با تخفیف'],brand:'TAKSOO'},
 {lines:['کمک خیریه','به نام برنده'],brand:'CHAYSA'}
];
const colors=['#7d3444','#b78348','#315d4b','#786044','#8b4b37','#b28b58','#3d6957','#79506a'];
const slice=Math.PI/4,center=360,radius=326;
let angle=0,remaining=2,busy=false;
function woodTexture(){
 const g=ctx.createRadialGradient(320,280,40,360,360,370);g.addColorStop(0,'#d6ad70');g.addColorStop(.55,'#a8733e');g.addColorStop(1,'#4b2a16');return g;
}
function draw(){
 ctx.clearRect(0,0,720,720);
 ctx.save();ctx.translate(center,center);ctx.rotate(angle);
 // Solid wooden body and concentric polished rims.
 ctx.beginPath();ctx.arc(0,0,radius+15,0,Math.PI*2);ctx.fillStyle='#3b2112';ctx.fill();
 ctx.lineWidth=18;ctx.strokeStyle='#c28d4b';ctx.stroke();
 ctx.beginPath();ctx.arc(0,0,radius+4,0,Math.PI*2);ctx.lineWidth=7;ctx.strokeStyle='#f0d39a';ctx.stroke();
 for(let i=0;i<8;i++){
   const a=-Math.PI/2+i*slice,b=a+slice;
   ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,radius,a,b);ctx.closePath();
   ctx.fillStyle=colors[i];ctx.fill();
   ctx.lineWidth=4;ctx.strokeStyle='#f0d49a';ctx.stroke();
   // Delicate wood-grain arcs in each sector.
   ctx.beginPath();ctx.arc(0,0,292,a+.035,b-.035);ctx.strokeStyle='rgba(255,229,183,.18)';ctx.lineWidth=2;ctx.stroke();
   // Prize labels are arranged radially, in generous two-line blocks.
   const mid=a+slice/2;ctx.save();ctx.rotate(mid);ctx.translate(0,-190);
   let rot=Math.PI/2;if(mid>Math.PI/2&&mid<Math.PI*1.5)rot=-Math.PI/2;
   ctx.rotate(rot);ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';
   const lines=prizes[i].lines;ctx.font='bold 22px Tahoma,Arial';ctx.fillStyle='#fff8e9';
   ctx.shadowColor='#24140d';ctx.shadowBlur=4;ctx.shadowOffsetY=2;
   const lineH=29,start=-(lines.length-1)*lineH/2;
   lines.forEach((line,j)=>ctx.fillText(line,0,start+j*lineH,145));
   ctx.restore();
   // Supplier names alternate around the outside edge of the prize sectors.
   ctx.save();ctx.rotate(mid);ctx.translate(0,-276);ctx.rotate(rot);
   ctx.direction='ltr';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 14px Arial';
   ctx.fillStyle='#fff0ca';ctx.shadowColor='#2b170b';ctx.shadowBlur=3;
   ctx.fillText(prizes[i].brand,0,0,100);ctx.restore();
 }
 // Fixed-looking circular hub; the real approved logo is a separate, non-rotating image above it.
 ctx.beginPath();ctx.arc(0,0,77,0,Math.PI*2);ctx.fillStyle='#f9f2df';ctx.fill();
 ctx.lineWidth=10;ctx.strokeStyle='#c99546';ctx.stroke();
 ctx.beginPath();ctx.arc(0,0,63,0,Math.PI*2);ctx.lineWidth=2;ctx.strokeStyle='#fff4d4';ctx.stroke();
 ctx.restore();
 // Small wooden studs around the outer rim.
 for(let i=0;i<24;i++){const a=i*Math.PI/12;ctx.beginPath();ctx.arc(center+Math.cos(a)*333,center+Math.sin(a)*333,3.2,0,Math.PI*2);ctx.fillStyle='#f2d39a';ctx.fill()}
}
draw();
spinBtn.addEventListener('click',()=>{
 if(busy||remaining===0)return;
 busy=true;remaining--;spinBtn.disabled=true;counter.textContent='فرصت آزمایشی: '+remaining+' از ۲';
 const index=Math.floor(Math.random()*8);
 const target=-(index*slice+slice/2);
 const current=((angle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
 let delta=((target-current)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
 delta+=Math.PI*2*6;
 const start=angle,end=angle+delta,t0=performance.now(),duration=5600;
 result.textContent='گردونه در حال چرخش است…';
 function frame(now){
  const p=Math.min(1,(now-t0)/duration),ease=1-Math.pow(1-p,4);
  angle=start+(end-start)*ease;draw();
  if(p<1)requestAnimationFrame(frame);
  else{angle=((angle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);draw();result.textContent='نتیجهٔ آزمایشی: '+prizes[index].lines.join(' — ');busy=false;spinBtn.disabled=remaining===0;if(!remaining)counter.textContent='هر دو فرصت آزمایشی استفاده شد'}
 }
 requestAnimationFrame(frame);
});
})();
</script>
</body></html>
